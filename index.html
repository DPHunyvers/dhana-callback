<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Retour vers Dhana</title>
  <style>
    :root { --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --accent: #0071e3; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #f5f5f7; --muted: #a1a1a6; --accent: #2997ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 17px -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 0 16px; }
    a { display: inline-block; margin-top: 16px; padding: 14px 28px; border-radius: 14px; background: var(--accent);
        color: #fff; text-decoration: none; font-weight: 600; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Connexion terminée</h1>
    <p>Retour vers l'app Dhana…</p>
    <a id="open" href="dhana://callback">Ouvrir Dhana</a>
  </main>
  <script>
    // Transmet code/state/erreur reçus de la banque à l'app, sans les envoyer ailleurs.
    var target = "dhana://callback" + window.location.search;
    document.getElementById("open").href = target;
    window.location.replace(target);
  </script>
</body>
</html>
